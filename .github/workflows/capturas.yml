name: Capturas
on:
  push:
    branches: [capturas-tmp]
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Esperar a la app
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8000/up >/dev/null && exit 0
            sleep 5
          done
          docker compose ps; docker compose logs --tail 200; exit 1
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p /tmp/s/out && cp docs/capturas.mjs /tmp/s/ && cd /tmp/s
          npm init -y >/dev/null && npm i playwright >/dev/null && npx playwright install --with-deps chromium >/dev/null
          OUT=/tmp/s/out node capturas.mjs || (cd $GITHUB_WORKSPACE && docker compose logs --tail 200 && exit 1)
      - run: |
          cp /tmp/s/out/*.png docs/
          git config user.name tmp && git config user.email tmp@example.com
          git add docs/*.png && git commit -qm capturas && git push
